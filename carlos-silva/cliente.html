   codigoUI('El código es incorrecto o ya fue usado. Pídele uno nuevo a Carlos.')}catch(x){er(x.message)}}}
function codigoUI(msg){frm('CÓDIGO DE INVITACIÓN',`<p style="color:var(--mut);margin-bottom:10px">Pega el código que te envió Carlos por WhatsApp para ver tu plan.</p><label>Código<input id="cd" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(CODIGO)}"></label><p id="er" role="alert" style="color:var(--bad);margin-top:8px;min-height:20px">${esc(msg||'')}</p><p style="margin-top:6px"><button class="btn" id="go">Vincular</button> <button class="btn sec sm" id="out">Salir</button></p>`);
 document.getElementById('out').onclick=()=>{Sv.api.salir();location.reload()};
 document.getElementById('go').onclick=async()=>{const k=document.getElementById('cd').value.trim();try{if(await Sv.reclamar(k))arrancar();else codigoUI('Código incorrecto o ya usado. Pídele uno nuevo a Carlos.')}catch(e){codigoUI('No se pudo vincular: '+e.message)}}}
async function arrancar(msg){
 if(!CS.remoto){const o=await cargar();if(!o){m.innerHTML='<p class="vacio">No encontramos tu plan.<br>Pídele a Carlos tu enlace por WhatsApp.</p>';return}c=o;try{FICHA=await Sv.ficha.cargar(c.cid,false)}catch(e){}if(c.activa!==false){try{FOTOS=await Sv.fotos.lista(c.cid,false)}catch(e){}try{SERIES=await Sv.series.cargar(c.cid,false)}catch(e){}}sel=hoyIdx();pintar();return}
 if(!Sv.api.hayCuenta())return authUI(msg);
 let o;try{o=await Sv.miPlan()}catch(e){if(e.status===401||e.status===403){Sv.api.salir();return authUI('Tu sesión venció. Ingresa de nuevo.')}m.innerHTML='<p class="vacio">No se pudo conectar. Revisa tu internet e intenta de nuevo.</p>';return}
 if(!o)return codigoUI();
 (o.custom||[]).forEach(x=>{if(!EJ.get(x.id)){const e=EJ.agregarPersonalizado(x);e.id=x.id}});c=o;try{FICHA=await Sv.ficha.cargar(c.cid,false)}catch(e){}
 if(c.activa===false){pintar();return}
 try{FOTOS=await Sv.fotos.lista(c.cid,false)}catch(e){}try{SERIES=await Sv.series.cargar(c.cid,false)}catch(e){}
 try{cache={};(await Sv.marcas(CS.dias(30))||[]).forEach(x=>{const k=x.k[0]==='m'?'m'+x.f:x.f;(cache[k]??=[]).push(+x.k.slice(1))})}catch(e){}
 sel=hoyIdx();pintar()}
arrancar();
</script></body></html>
