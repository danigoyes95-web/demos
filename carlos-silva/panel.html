<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel del coach · Carlos Silva</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05090d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap"><link rel="stylesheet" href="estilos.css">
<style>.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:#071016;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside b{font-size:19px;padding:0 10px 12px}aside button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:10px;color:var(--mut);min-height:44px}aside button[aria-selected=true]{background:#19e3ee1a;color:var(--neon);font-weight:700}
main{padding:22px 24px 60px;min-width:0}h1{font-size:26px;margin-bottom:14px}.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.k b{display:block;font-size:28px}.k small{color:var(--mut)}.cl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px;flex-wrap:wrap}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}.sub{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.sub button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--mut);min-height:38px}.sub button[aria-selected=true]{border-color:var(--neon);color:var(--neon)}
.rw{display:grid;grid-template-columns:1fr 62px 72px 62px 70px 34px;gap:6px;align-items:center;margin-top:6px}.rw input{min-height:36px;padding:5px 8px}.rw button{min-height:34px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.lib button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left}.lib svg{width:100%;height:auto;background:#08121a;border-radius:10px}
.pk{max-height:46vh;overflow:auto}.ln{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;word-break:break-all;font-size:12px;max-height:80px;overflow:auto}
#login{max-width:340px;margin:18vh auto;text-align:center}.fx{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:800px){.rw span:nth-child(n+4){display:none}.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px}aside b{display:none}main{padding:14px 14px 60px}.rw{grid-template-columns:1fr 1fr}.rw span{grid-column:1/-1}}</style></head><body>
<div id="login" class="card"><h1>Panel del coach</h1><p style="color:var(--mut);margin-bottom:12px">Demo: la clave es <b>coach</b></p><label>Clave<input id="pw" type="password" autocomplete="current-password"></label><p style="margin-top:12px"><button class="btn" id="go">Entrar</button></p><p id="er" class="bad" role="alert"></p></div>
<div class="app" id="app" hidden><aside><b>Carlos Silva</b><button data-v="res">Resumen</button><button data-v="cli">Clientes</button><button data-v="lib">Ejercicios</button><button data-v="cal">Calculadoras</button><button data-v="cfg">Datos demo</button></aside><main id="m"></main></div>
<dialog id="dg"></dialog><div id="print-root"></div>
<script src="config.js"></script><script src="ejercicios.js"></script><script src="app.js"></script><script src="ui.js"></script><script>
const {esc,fecha,hoy,Store,calc,Doc,Link,wa,RUTINAS,pend,uid}=CS,C=COACH,$=s=>document.querySelector(s);let vista='res',cid=null,sub='perfil',grF='';
const db=()=>Store.db(),cur=()=>Store.cliente(cid),save=()=>Store.save();
$('#go').onclick=()=>{if($('#pw').value===C.claveDemo){sessionStorage.setItem('cs_ok','1');ent()}else $('#er').textContent='Clave incorrecta.'};$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
function ent(){$('#login').hidden=true;$('#app').hidden=false;pintar()}if(sessionStorage.getItem('cs_ok'))ent();
document.querySelector('aside').onclick=e=>{const b=e.target.closest('[data-v]');if(b){vista=b.dataset.v;cid=null;pintar()}};
function pintar(){document.querySelectorAll('aside button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===vista));m.innerHTML=cid?fCli():({res:vRes,cli:vCli,lib:vLib,cal:vCal,cfg:vCfg}[vista])();if(vista==='cal'&&!cid)calcInit()}
/* ---------- resumen ---------- */
function vRes(){const cs=db().clientes.filter(c=>c.estado==='activo'),p=cs.map(c=>[c,pend(c)]);const n=k=>p.filter(x=>x[1][k]).length;
 return `<h1>Resumen</h1><div class="g g4"><div class="card k"><b>${cs.length}</b><small>clientes activos</small></div><div class="card k"><b class="${n('inbody')?'warn':''}">${n('inbody')}</b><small>InBody mensual pendiente</small></div><div class="card k"><b class="${n('eval')?'warn':''}">${n('eval')}</b><small>evaluación técnica semanal pendiente</small></div><div class="card k"><b class="${n('riesgo')?'bad':''}">${n('riesgo')}</b><small>con alerta PAR-Q / lesión</small></div></div>
 <h2 style="margin:18px 0 8px">Requieren atención</h2>`+(p.filter(x=>x[1].inbody||x[1].eval||x[1].riesgo).map(([c,q])=>`<button class="card cl" data-c="${c.id}"><b>${esc(c.nombre)}</b><span>${q.inbody?'<span class="chip warn">InBody</span> ':''}${q.eval?'<span class="chip warn">Evaluación técnica</span> ':''}${q.riesgo?'<span class="chip bad">PAR-Q</span>':''}</span></button>`).join('')||'<p class="ok">Todo al día 🎉</p>')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){vista='cli';cid=b.dataset.c;sub='perfil';pintar()}});
/* ---------- clientes ---------- */
function vCli(){return `<h1>Clientes <button class="btn sm" data-a="nuevo">+ Nuevo</button></h1>`+db().clientes.map(c=>{const u=c.medidas.at(-1);return `<button class="card cl" data-c="${c.id}"><span><b>${esc(c.nombre)}</b><br><small style="color:var(--mut)">${esc(c.obj)} · ${esc(c.mod)} · ${u?esc(u.kg)+' kg':'sin InBody'}</small></span><span><span class="chip">${c.rutina?'Rutina ✓':'Sin rutina'}</span> <span class="chip">${c.plan?'Plan ✓':'Sin plan'}</span></span></button>`}).join('')}
const SUBS=[['perfil','Perfil'],['rutina','Rutina'],['plan','Alimentación'],['inbody','InBody / progreso'],['eval','Eval. técnica'],['supl','Suplementos'],['enviar','PDF y envío']];
function fCli(){const c=cur();return `<button class="btn sec sm" data-a="volver">← Clientes</button><h1 style="margin-top:10px">${esc(c.nombre)}</h1><div class="sub" role="tablist">${SUBS.map(([k,t])=>`<button role="tab" data-s="${k}" aria-selected="${k===sub}">${t}</button>`).join('')}</div>`+({perfil:sPerfil,rutina:sRutina,plan:sPlan,inbody:sInbody,eval:sEval,supl:sSupl,enviar:sEnviar}[sub])(c)}
const inp=(c,k,l,t='text',ex='')=>`<label>${l}<input type="${t}" data-f="${k}" value="${esc(c[k])}" ${ex}></label>`;
function sPerfil(c){const P={corazon:'Problema cardíaco o presión alta',dolor:'Dolor en pecho o lumbar al esforzarse',mareo:'Mareos o desmayos',hueso:'Lesión de hueso/articulación',medic:'Toma medicación crónica',embarazo:'Embarazo / posparto reciente'};
 return `<div class="card"><div class="fx">${inp(c,'nombre','Nombre')}${inp(c,'tel','WhatsApp (593…)')}${inp(c,'nac','Nacimiento','date')}${inp(c,'cm','Estatura (cm)','number')}
 <label>Sexo<select data-f="sx"><option value="M" ${c.sx==='M'?'selected':''}>Masculino</option><option value="F" ${c.sx==='F'?'selected':''}>Femenino</option></select></label>
 <label>Objetivo<select data-f="obj">${[['volumen','Ganar masa'],['definicion','Perder grasa'],['salud','Salud / mantener'],['fuerza','Fuerza']].map(([v,t])=>`<option value="${v}" ${c.obj===v?'selected':''}>${t}</option>`).join('')}</select></label>
 <label>Modalidad<select data-f="mod"><option ${c.mod==='presencial'?'selected':''}>presencial</option><option ${c.mod==='virtual'?'selected':''}>virtual</option></select></label>
 <label>Nivel<select data-f="nivel">${['Principiante','Intermedio','Avanzado'].map(v=>`<option ${c.nivel===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
 ${inp(c,'lesiones','Lesiones / limitaciones')}<label style="margin-top:8px">Notas del coach<textarea data-f="notas" rows="2">${esc(c.notas)}</textarea></label></div>
 <div class="card" style="margin-top:12px"><h3>Cuestionario de aptitud (PAR-Q)</h3><p style="color:var(--mut);font-size:13px">Si hay algún "sí", pide autorización médica antes de cargar intensidad.</p>${Object.entries(P).map(([k,t])=>`<label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" style="width:auto;min-height:0" data-q="${k}" ${c.parq[k]?'checked':''}> ${t}</label>`).join('')}</div>`}
/* ---------- rutina ---------- */
function sRutina(c){const r=c.rutina;
 const tpl=`<div class="tools"><select id="tp" aria-label="Plantilla">${Object.keys(RUTINAS).map(k=>`<option>${esc(k)}</option>`).join('')}</select><button class="btn sm" data-a="tpl">Cargar plantilla</button></div>`;
 if(!r)return `<div class="card"><p>Este cliente no tiene rutina. Parte de una plantilla y ajústala.</p>${tpl}</div>`;
 return `${tpl}<div class="card"><div class="fx">${inpR(r,'nombre','Nombre de la rutina')}${inpR(r,'obj','Objetivo')}${inpR(r,'semanas','Semanas','number')}</div></div>`+r.dias.map((d,i)=>`<div class="card" style="margin-top:12px"><div class="fx"><label>Día<input data-d="${i}" data-k="nombre" value="${esc(d.nombre)}"></label><label>Enfoque<input data-d="${i}" data-k="foco" value="${esc(d.foco)}"></label><label>Día de la semana<select data-d="${i}" data-k="dow">${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'].map((n,k)=>`<option value="${k}" ${CS.diaSem(r,i)===k?'selected':''}>${n}</option>`).join('')}</select></label></div>
  <div class="rw" style="color:var(--mut);font-size:12px"><span>Ejercicio</span><span>Series</span><span>Reps</span><span>Kg</span><span>Desc.</span><span></span></div>`+d.ej.map((x,j)=>`<div class="rw"><button class="btn sec sm" style="justify-content:flex-start;text-align:left" data-ej="${esc(x.id)}">${esc(EJ.get(x.id)?.n||x.id)}</button><input data-d="${i}" data-j="${j}" data-k="series" value="${esc(x.series)}" aria-label="Series"><input data-d="${i}" data-j="${j}" data-k="reps" value="${esc(x.reps)}" aria-label="Repeticiones"><input data-d="${i}" data-j="${j}" data-k="kg" value="${esc(x.kg??'')}" aria-label="Kilos" inputmode="decimal"><input data-d="${i}" data-j="${j}" data-k="desc" value="${esc(x.desc)}" aria-label="Descanso"><button class="btn bad sm" data-a="delej" data-d="${i}" data-j="${j}" aria-label="Quitar">✕</button></div>`).join('')+`<p style="margin-top:8px"><button class="btn sm sec" data-a="addej" data-d="${i}">+ Ejercicio</button> <button class="btn sm bad" data-a="deldia" data-d="${i}">Quitar día</button></p></div>`).join('')+`<p style="margin-top:12px"><button class="btn sm sec" data-a="adddia">+ Día</button></p>`}
const inpR=(r,k,l,t='text')=>`<label>${l}<input type="${t}" data-r="${k}" value="${esc(r[k]??'')}"></label>`;
/* ---------- plan alimenticio ---------- */
function sPlan(c){const u=c.medidas.at(-1),kg=u?u.kg:70,ed=calc.edad(c.nac),tmb=calc.tmb(c.sx,kg,c.cm,ed),p=c.plan;
 const gen=`<div class="card"><h3>Calcular objetivo</h3><p style="color:var(--mut);font-size:13px">TMB (Mifflin-St Jeor): <b>${Math.round(tmb)} kcal</b> con ${kg} kg, ${c.cm} cm, ${ed} años.</p><div class="tools"><select id="act">${Object.entries(CS.ACT).map(([v,t])=>`<option value="${v}" ${v==1.55?'selected':''}>${t}</option>`).join('')}</select><button class="btn sm" data-a="genplan">Generar plan base</button></div></div>`;
 if(!p)return gen;const tot=p.p*4+p.c*4+p.g*9;
 return gen+`<div class="card" style="margin-top:12px"><div class="fx">${inpP(p,'kcal','Calorías')}${inpP(p,'p','Proteína (g)')}${inpP(p,'c','Carbohidratos (g)')}${inpP(p,'g','Grasas (g)')}${inpP(p,'agua','Hidratación','text')}</div><p style="color:var(--mut);font-size:13px;margin-top:6px">Los macros suman ${tot} kcal (${Math.round(tot/p.kcal*100)||0}% del objetivo).</p></div>`+
 p.comidas.map((m,i)=>`<div class="card" style="margin-top:10px"><div class="fx"><label>Hora<input data-m="${i}" data-k="h" value="${esc(m.h)}"></label><label>Comida<input data-m="${i}" data-k="n" value="${esc(m.n)}"></label></div><label style="margin-top:6px">Alimentos (uno por línea)<textarea data-m="${i}" data-k="it" rows="${m.it.length+1}">${esc(m.it.join('\n'))}</textarea></label><p style="margin-top:6px"><button class="btn bad sm" data-a="delm" data-m="${i}">Quitar</button></p></div>`).join('')+
 `<p style="margin-top:10px"><button class="btn sm sec" data-a="addm">+ Comida</button></p><label style="margin-top:10px">Indicaciones<textarea data-p="notas" rows="2">${esc(p.notas)}</textarea></label>`}
const inpP=(p,k,l,t='number')=>`<label>${l}<input type="${t}" data-p="${k}" value="${esc(p[k])}"></label>`;
/* ---------- InBody ---------- */
function sInbody(c){const m=c.medidas;
 return `<div class="card"><h3>Registrar chequeo InBody</h3><div class="fx" id="ib"><label>Fecha<input type="date" id="ib_f" value="${hoy()}"></label>${[['kg','Peso (kg)'],['gr','% grasa'],['mm','Masa muscular (kg)'],['vis','Grasa visceral'],['agua','Agua corporal %']].map(([k,t])=>`<label>${t}<input type="number" step="0.1" id="ib_${k}"></label>`).join('')}</div><p style="margin-top:10px"><button class="btn sm" data-a="addib">Guardar chequeo</button></p></div>`+
 (m.length?`<div class="card" style="margin-top:12px">${grafico(m)}<table style="width:100%;font-size:14px;margin-top:10px"><tr><th align=left>Fecha</th><th align=left>Peso</th><th align=left>% grasa</th><th align=left>Músculo</th><th align=left>Visc.</th><th></th></tr>${m.map((x,i)=>`<tr><td>${esc(fecha(x.f))}</td><td>${esc(x.kg)}</td><td>${esc(x.gr)}</td><td>${esc(x.mm)}</td><td>${esc(x.vis)}</td><td><button class="btn bad sm" data-a="delib" data-i="${i}" aria-label="Eliminar">✕</button></td></tr>`).join('')}</table></div>`:'')}
function grafico(m){if(m.length<2)return '<p style="color:var(--mut)">Con 2 chequeos se dibuja la evolución.</p>';const W=560,H=150,P=26,ser=[['kg','Peso kg','#19e3ee'],['mm','Músculo kg','#3ddc97'],['gr','% grasa','#ffc857']];
 const t=m.map(x=>+new Date(x.f)),t0=Math.min(...t),t1=Math.max(...t);
 return `<svg viewBox="0 0 ${W} ${H+30}" style="width:100%" role="img" aria-label="Evolución de peso, músculo y grasa">`+ser.map(([k,n,col],si)=>{const v=m.map(x=>x[k]),a=Math.min(...v),b=Math.max(...v)||1,pts=m.map((x,i)=>`${P+(W-2*P)*((t[i]-t0)/((t1-t0)||1))},${H-P/2-(H-P)*((x[k]-a)/((b-a)||1))}`);
  return `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.join(' ')}"/>`+pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5" fill="${col}"/>`).join('')+`<text x="${P+si*150}" y="${H+22}" fill="${col}" font-size="13">● ${n}: ${v[0]} → ${v.at(-1)}</text>`}).join('')+`</svg>`}
/* ---------- evaluación técnica ---------- */
function sEval(c){const ex=[...new Set((c.rutina?.dias||[]).flatMap(d=>d.ej.map(x=>x.id)))];
 return `<div class="card"><h3>Evaluación técnica semanal</h3>${ex.length?`<label>Observación general<input id="ev_n" placeholder="Resumen de la semana"></label>`+ex.map(id=>`<div class="fx" style="margin-top:8px;align-items:end"><b>${esc(EJ.get(id)?.n||id)}</b><label>Técnica<select data-ev="${esc(id)}" data-t="pt"><option value="">—</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></label><label>Corrección<input data-ev="${esc(id)}" data-t="n"></label></div>`).join('')+`<p style="margin-top:10px"><button class="btn sm" data-a="addev">Guardar evaluación</button></p>`:'<p>Asigna una rutina para evaluar sus ejercicios.</p>'}</div>`+
 c.evals.slice().reverse().map(e=>`<div class="card" style="margin-top:10px"><b>${esc(fecha(e.f))}</b> · ${esc(e.nota)}<br>${e.it.map(i=>`<small>${esc(EJ.get(i.id)?.n||i.id)}: ${i.pt}/5 ${esc(i.n)}</small>`).join('<br>')}</div>`).join('')}
/* ---------- suplementos ---------- */
function sSupl(c){return `<div class="card"><h3>Protocolo de suplementación</h3>`+c.supl.map((s,i)=>`<div class="fx" style="margin-top:8px"><label>Producto<input data-su="${i}" data-k="n" value="${esc(s.n)}"></label><label>Dosis<input data-su="${i}" data-k="dosis" value="${esc(s.dosis)}"></label><label>Cuándo<input data-su="${i}" data-k="mom" value="${esc(s.mom)}"></label><button class="btn bad sm" data-a="delsu" data-i="${i}">Quitar</button></div>`).join('')+`<p style="margin-top:10px"><button class="btn sm sec" data-a="addsu">+ Suplemento</button></p><p style="color:var(--mut);font-size:12px;margin-top:8px">Recomienda solo productos con respaldo y verifica antecedentes médicos del cliente.</p></div>`}
/* ---------- PDF y envío ---------- */
function sEnviar(c){return `<div class="card"><h3>PDF para el cliente</h3><p style="color:var(--mut);font-size:13px">Se abre el diálogo de impresión: elige <b>Guardar como PDF</b> y envíalo por WhatsApp.</p><div class="tools"><button class="btn sm" data-a="pdf" data-k="rutina">⬇ Rutina PDF</button><button class="btn sm" data-a="pdf" data-k="plan">⬇ Plan alimenticio PDF</button><button class="btn sm sec" data-a="pdf" data-k="progreso">⬇ Reporte de progreso</button></div></div>
 <div class="card" style="margin-top:12px"><h3>Portal del cliente (enlace)</h3><p style="color:var(--mut);font-size:13px">El enlace lleva el plan completo: rutina, alimentación y guía visual de cada ejercicio. Funciona en el celular del cliente.</p><div class="tools"><button class="btn sm" data-a="lnk">Generar enlace</button><a class="btn sm sec" target="_blank" rel="noopener" href="cliente.html?demo=${esc(c.id)}">Vista previa</a></div><div id="lk"></div></div>`}
/* ---------- biblioteca ---------- */
function vLib(){return `<h1>Biblioteca de ejercicios <button class="btn sm" data-a="newex">+ Propio</button></h1><div class="sub">${['',...EJ.grupos].map(g=>`<button data-g="${g}" aria-selected="${g===grF}">${g||'Todos'}</button>`).join('')}</div><div class="lib">`+EJ.lista.filter(e=>!grF||e.gr===grF).map(e=>`<button data-ej="${esc(e.id)}">${EJ.miniatura(e)}<b>${esc(e.n)}</b><br><small style="color:var(--mut)">${esc(e.gr)} · ${esc(e.niv)}</small></button>`).join('')+`</div>`}
/* ---------- calculadoras ---------- */
function vCal(){return `<h1>Calculadoras</h1><div class="g g2"><div class="card"><h3>Gasto y macros</h3><label>Sexo<select id="c_s"><option value="M">Masculino</option><option value="F">Femenino</option></select></label><label>Peso (kg)<input id="c_k" type="number" value="75"></label><label>Estatura (cm)<input id="c_h" type="number" value="175"></label><label>Edad<input id="c_e" type="number" value="30"></label><label>Actividad<select id="c_a">${Object.entries(CS.ACT).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label><label>Objetivo<select id="c_o"><option value="volumen">Ganar masa</option><option value="definicion">Perder grasa</option><option value="salud">Mantener</option></select></label><div id="c_r" style="margin-top:10px"></div></div>
 <div class="card"><h3>1RM estimado (Epley)</h3><label>Peso levantado (kg)<input id="r_k" type="number" value="80"></label><label>Repeticiones<input id="r_r" type="number" value="6"></label><div id="r_o" style="margin-top:10px"></div></div></div>`}
function calcInit(){const f=()=>{const v=id=>+$('#'+id).value,tmb=calc.tmb($('#c_s').value,v('c_k'),v('c_h'),v('c_e')),t=tmb*v('c_a'),kc=calc.kcalObj(t,$('#c_o').value),mc=calc.macros(kc,v('c_k'),$('#c_o').value);
 $('#c_r').innerHTML=`TMB <b>${Math.round(tmb)}</b> · Mantenimiento <b>${Math.round(t)}</b> kcal<br>Objetivo <b>${kc} kcal</b> · P ${mc.p} g · C ${mc.c} g · G ${mc.g} g<br>IMC ${calc.imc(v('c_k'),v('c_h')).toFixed(1)}`;
 $('#r_o').innerHTML=`1RM ≈ <b>${calc.rm(v('r_k'),v('r_r'))} kg</b><br><small>70% ≈ ${Math.round(calc.rm(v('r_k'),v('r_r'))*.7)} kg · 85% ≈ ${Math.round(calc.rm(v('r_k'),v('r_r'))*.85)} kg</small>`};
 m.querySelectorAll('input,select').forEach(e=>e.oninput=f);f()}
function vCfg(){return `<h1>Datos de la demo</h1><div class="card"><p>Todo se guarda en este navegador. Para uso real se conecta una base de datos y un login (Supabase), igual que las otras demos.</p><p style="margin-top:10px"><button class="btn bad sm" data-a="reset">Restaurar datos de ejemplo</button></p></div>`}
/* ---------- acciones ---------- */
const pick=(fn)=>{const d=$('#dg');d.innerHTML=`<button class="btn sec sm x" onclick="dg.close()" aria-label="Cerrar">✕</button><h3>Elegir ejercicio</h3><input id="bq" placeholder="Buscar…" aria-label="Buscar"><div class="sub">${['',...EJ.grupos].map(g=>`<button data-pg="${g}">${g||'Todos'}</button>`).join('')}</div><div class="pk lib" id="pl"></div>`;
 let g='';const r=()=>{const q=$('#bq').value.toLowerCase();$('#pl').innerHTML=EJ.lista.filter(e=>(!g||e.gr===g)&&e.n.toLowerCase().includes(q)).map(e=>`<button data-pid="${esc(e.id)}">${EJ.miniatura(e)}<b>${esc(e.n)}</b></button>`).join('')};
 d.onclick=e=>{const a=e.target.closest('[data-pg]');if(a){g=a.dataset.pg;r()}const b=e.target.closest('[data-pid]');if(b){d.close();d.onclick=null;fn(b.dataset.pid)}};d.showModal();$('#bq').oninput=r;r()};
const A={
 nuevo(){cid=Store.nuevo().id;sub='perfil';pintar()},volver(){cid=null;pintar()},reset(){if(confirm('¿Restaurar los datos de ejemplo? Se pierden los cambios.')){Store.reset();pintar()}},
 tpl(){const c=cur();c.rutina=JSON.parse(JSON.stringify(RUTINAS[$('#tp').value]));c.rutina.obj=c.obj;save();pintar()},
 addej(b){pick(id=>{cur().rutina.dias[+b.dataset.d].ej.push({id,series:3,reps:'10',desc:'60 s',nota:''});save();pintar()})},
 delej(b){cur().rutina.dias[+b.dataset.d].ej.splice(+b.dataset.j,1);save();pintar()},deldia(b){cur().rutina.dias.splice(+b.dataset.d,1);save();pintar()},
 adddia(){const r=cur().rutina;r.dias.push({nombre:'Día '+(r.dias.length+1),foco:'',ej:[]});save();pintar()},
 genplan(){const c=cur(),u=c.medidas.at(-1),kg=u?u.kg:70,t=calc.tmb(c.sx,kg,c.cm,calc.edad(c.nac))*$('#act').value,kc=calc.kcalObj(t,c.obj),pl=CS.planBase(kc,calc.macros(kc,kg,c.obj));if(c.plan&&!confirm('Esto reemplaza el plan actual. ¿Continuar?'))return;c.plan=pl;save();pintar()},
 addm(){cur().plan.comidas.push({h:'',n:'Comida',it:[]});save();pintar()},delm(b){cur().plan.comidas.splice(+b.dataset.m,1);save();pintar()},
 addib(){const c=cur(),o={f:$('#ib_f').value||hoy()};for(const k of ['kg','gr','mm','vis','agua']){o[k]=+$('#ib_'+k).value;if(!o[k]&&k!=='vis'){alert('Completa peso, % grasa, masa muscular y agua.');return}}c.medidas.push(o);c.medidas.sort((a,b)=>a.f<b.f?-1:1);save();pintar()},
 delib(b){cur().medidas.splice(+b.dataset.i,1);save();pintar()},
 addev(){const c=cur(),it=[...new Set([...document.querySelectorAll('[data-ev]')].map(e=>e.dataset.ev))].map(id=>({id,pt:+document.querySelector(`[data-ev="${id}"][data-t=pt]`).value,n:document.querySelector(`[data-ev="${id}"][data-t=n]`).value})).filter(x=>x.pt);if(!it.length){alert('Califica al menos un ejercicio.');return}c.evals.push({f:hoy(),nota:$('#ev_n').value,it});save();pintar()},
 addsu(){cur().supl.push({n:'',dosis:'',mom:''});save();pintar()},delsu(b){cur().supl.splice(+b.dataset.i,1);save();pintar()},
 pdf(b){const c=cur();Doc.imprimir(Doc[b.dataset.k](c),b.dataset.k+' - '+c.nombre)},
 async lnk(){const c=cur(),u=await Link.url(c);$('#lk').innerHTML=`<div class="ln">${esc(u)}</div><div class="tools"><button class="btn sm" id="cp">Copiar</button><a class="btn sm sec" target="_blank" rel="noopener" href="${esc(wa(c.tel,`Hola ${c.nombre.split(' ')[0]}, este es tu plan de entrenamiento y alimentación: ${u}`))}">Enviar por WhatsApp</a></div><small style="color:var(--mut)">${u.length} caracteres. Quien tenga el enlace ve el plan: envíalo solo al cliente.</small>`;$('#cp').onclick=()=>navigator.clipboard.writeText(u).then(()=>$('#cp').textContent='Copiado ✓')},
 newex(){const d=$('#dg');d.innerHTML=`<button class="btn sec sm x" onclick="dg.close()" aria-label="Cerrar">✕</button><h3>Ejercicio propio</h3><label>Nombre<input id="n_n"></label><label>Grupo<select id="n_g">${EJ.grupos.map(g=>`<option>${g}</option>`).join('')}</select></label><label>Músculos<input id="n_m"></label><label>Pasos (uno por línea)<textarea id="n_p" rows="3"></textarea></label><label>Enlace a video (opcional)<input id="n_v" placeholder="https://"></label><p style="margin-top:10px"><button class="btn" id="n_ok">Guardar</button></p>`;d.showModal();$('#n_ok').onclick=()=>{if(!$('#n_n').value.trim())return;const o={n:$('#n_n').value.trim(),gr:$('#n_g').value,mus:$('#n_m').value,pasos:$('#n_p').value.split('\n').filter(Boolean),video:/^https?:\/\//.test($('#n_v').value)?$('#n_v').value:''},e=EJ.agregarPersonalizado(o);db().custom.push({...o,id:e.id});save();d.close();pintar()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b);const s=e.target.closest('[data-s]');if(s){sub=s.dataset.s;pintar()}const g=e.target.closest('[data-g]');if(g){grF=g.dataset.g;pintar()}});
document.addEventListener('change',e=>{const t=e.target,c=cid&&cur();if(!c)return;const num=v=>t.type==='number'?+v:v;
 if(t.dataset.f){c[t.dataset.f]=num(t.value)}else if(t.dataset.q)c.parq[t.dataset.q]=t.checked;else if(t.dataset.r)c.rutina[t.dataset.r]=num(t.value);
 else if(t.dataset.d!==undefined&&t.dataset.j===undefined)c.rutina.dias[+t.dataset.d][t.dataset.k]=t.value;else if(t.dataset.j!==undefined)c.rutina.dias[+t.dataset.d].ej[+t.dataset.j][t.dataset.k]=t.value;
 else if(t.dataset.p)c.plan[t.dataset.p]=num(t.value);else if(t.dataset.m!==undefined)c.plan.comidas[+t.dataset.m][t.dataset.k]=t.dataset.k==='it'?t.value.split('\n').map(s=>s.trim()).filter(Boolean):t.value;
 else if(t.dataset.su!==undefined)c.supl[+t.dataset.su][t.dataset.k]=t.value;else return;save();if(t.dataset.p==='kcal'||t.dataset.f==='nombre'||t.dataset.q)pintar()});
