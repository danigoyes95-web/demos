 if(!ACT_&&!actCarga){actCarga=true;Store.actividadTodos().then(x=>{ACT_=x;actCarga=false;if(vista==='res'&&!cid)pintar()}).catch(()=>{actCarga=false})}
 const V=CS.ventana();if(!FOT_&&!fotCarga){fotCarga=true;Store.fotos.estado(V.fecha).then(x=>{FOT_=x;fotCarga=false;if(vista==='res'&&!cid)pintar()}).catch(()=>{fotCarga=false;FOT_={}})}
 if(!FIC_&&!ficCarga){ficCarga=true;Store.ficha.estado().then(x=>{FIC_=x;ficCarga=false;if(vista==='res'&&!cid)pintar()}).catch(()=>{ficCarga=false})}
 const venc=cs.map(c=>({c,d:CS.venceDias(c)})).filter(x=>x.d==null||x.d<=7).sort((a,b)=>(a.d??-999)-(b.d??-999)),ev=V.estado==='proximo'?'aviso':V.estado,F=FOT_||{},recibidos=cs.filter(c=>(F[c.id]||0)>=3).length;
 const mes=CS.ymd(new Date()).slice(0,7),pagosMes=db().clientes.flatMap(c=>(c.pagos||[]).filter(x=>x.f.startsWith(mes))),ingMes=+pagosMes.reduce((s,x)=>s+x.monto,0).toFixed(2),nPagos=pagosMes.length;
 const cu=cs.map(c=>({c,p:c.rutina?M.pct(c,H(c),0,7):null,pa:c.rutina?M.pct(c,H(c),7,7):null,r:M.racha(c,H(c)),q:pend(c)})),con=cu.filter(x=>x.p!=null),equipo=con.length?con.reduce((s,x)=>s+x.p,0)/con.length:0,
 comp7=cs.reduce((s,c)=>s+M.completos(c,H(c),0,7),0),comp7a=cs.reduce((s,c)=>s+M.completos(c,H(c),7,7),0),

 alertas=cu.filter(x=>x.q.inbody||x.q.eval||x.q.riesgo||(FIC_&&!FIC_[x.c.id])),hr=new Date().getHours(),sal=hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';
 const act14=[...Array(14)].map((_,k)=>{const f=dias(13-k);return cs.reduce((s,c)=>s+(H(c)[f]||[]).length,0)}),lab14=[...Array(14)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-(13-k));return DL[(d.getDay()+6)%7]});
 const OB={volumen:['Ganar masa','#19e3ee'],definicion:['Perder grasa','#ff9f1c'],salud:['Salud','#3ddc97'],fuerza:['Fuerza','#b48cff']},ob=Object.entries(OB).map(([k,[l,col]])=>({k,l,v:cs.filter(c=>c.obj===k).length,color:col})).filter(x=>x.v);
 const rank=[...con].sort((a,b)=>b.p-a.p),med=['🥇 ','🥈 ','🥉 '],dl=(v,inv)=>`<span class="${(inv?v<=0:v>=0)?'up':'dw'}">${v>0?'▲':v<0?'▼':'•'} ${Math.abs(v).toFixed(1).replace('.',',')}</span>`;
 return `<div class="dash">
 <div class="glass hero-d" style="display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center"><div><small class="ne or" style="letter-spacing:.2em">PANEL DEL COACH</small><h1 class="big" style="font-size:clamp(26px,4vw,42px);margin:8px 0 6px">${sal}, Carlos</h1>

  <p style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill2">${cs.filter(c=>c.mod==='presencial').length} presenciales</span><span class="pill2">${cs.filter(c=>c.mod==='virtual').length} virtuales</span>${alertas.length?`<span class="pill2 w">${alertas.length} con pendientes</span>`:'<span class="pill2 g">Sin pendientes</span>'}</p></div>
  <div style="text-align:center">${CH.anillo(equipo,{size:158,w:14,sub:'cumplimiento',aria:'Cumplimiento del equipo '+Math.round(equipo)+'%'})}</div></div>

 <div class="cols2"><div class="glass"><h3>⏳ Mensualidades por vencer</h3>${venc.length?venc.map(({c,d})=>`<div class="tr" style="grid-template-columns:1fr auto auto"><span style="display:flex;align-items:center"><span class="ava">${esc(ini(c.nombre))}</span><span><b>${esc(c.nombre)}</b><br><small style="color:var(--mut)">${c.vence?esc(fecha(c.vence)):'Sin pago registrado'}</small></span></span><span class="pill2 ${d==null||d<0?'r':d<=3?'w':''}">${d==null?'Sin activar':d<0?'Venció hace '+(-d)+' d':d===0?'Vence hoy':'Vence en '+d+' d'}</span><span style="display:flex;gap:6px"><button class="btn sm" data-a="actres" data-id="${c.id}">Activar</button>${c.tel&&d!=null?`<a class="btn sm sec" target="_blank" rel="noopener" href="${esc(wa(c.tel,CS.msgVence(c)))}">Recordar</a>`:''}</span></div>`).join(''):'<p class="ok">Ninguna mensualidad vence en los próximos 7 días 🎉</p>'}<p style="color:var(--mut);font-size:12px;margin-top:8px">Los clientes ven este aviso también en su portal.</p></div>
  <div class="glass"><h3>📸 Check-in · sábado ${esc(fecha(V.fecha))}</h3><div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">${CH.anillo(cs.length?recibidos/cs.length*100:0,{size:84,w:10,centro:recibidos+'/'+cs.length,aria:'Check-ins recibidos'})}<span style="color:var(--mut);font-size:14px">${V.estado==='proximo'?'Se abre el viernes al mediodía. El aviso a tus clientes sale el viernes a las 18:00.':V.estado==='aviso'?'Hoy en la noche avisa: mañana es el check-in.':'Fotos recibidas esta semana.'}</span></div>
  ${cs.map(c=>{const n=F[c.id]||0;return `<div class="tr" style="grid-template-columns:1fr auto auto"><span><b>${esc(c.nombre)}</b></span><span class="pill2 ${n>=3?'g':n?'w':''}">${n}/3 fotos</span>${n<3&&c.tel?`<a class="btn sm sec" target="_blank" rel="noopener" href="${esc(wa(c.tel,CS.msgCheckin(c,ev)))}">Recordar</a>`:'<span></span>'}</div>`}).join('')}</div></div>
 <div class="kt">
  <div class="glass"><h3>Ingresos del mes</h3><b class="n up" data-count="${ingMes}" data-pre="$" ${ingMes%1?'data-dec="2"':''}>$${ingMes}</b><small>${nPagos} pago${nPagos===1?'':'s'} registrado${nPagos===1?'':'s'}</small></div>

 <div class="cols"><div class="glass"><h3>Actividad del equipo · 14 días</h3>${CH.barras(act14,{h:130,labels:lab14,hoy:13,aria:'Ejercicios completados por día'})}<small style="color:var(--mut)">Ejercicios marcados por tus clientes cada día.</small></div>
  <div class="glass"><h3>Objetivos</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center">${CH.donut(ob,{size:130,w:18,centro:cs.length,sub:'clientes',aria:'Distribución por objetivo'})}<div class="leg">${ob.map(x=>`<span><i style="background:${x.color}"></i>${x.l} · <b>${x.v}</b></span>`).join('')}</div></div></div></div>
 <div class="cols2"><div class="glass"><h3>Constancia · quién entrena</h3>${rank.length?CH.hbar(rank.map((x,i)=>({label:x.c.nombre,v:x.p,pre:med[i]||'',color:x.p>=75?'linear-gradient(90deg,#0aa9b8,#3ddc97)':x.p>=40?'linear-gradient(90deg,#0aa9b8,#19e3ee)':'linear-gradient(90deg,#b8860b,#ffc857)'}))):'<p style="color:var(--mut)">Aún sin datos.</p>'}${rank.some(x=>x.r>1)?`<p style="margin-top:10px;color:var(--mut);font-size:13px">🔥 Mejor racha: <b style="color:var(--ink)">${esc(rank.sort((a,b)=>b.r-a.r)[0].c.nombre)}</b> con ${rank[0].r} entrenos seguidos.</p>`:''}</div>

 (m.length?`<div class="card" style="margin-top:12px">${grafico(m)}<table style="width:100%;font-size:14px;margin-top:10px"><tr><th align=left>Fecha</th><th align=left>Peso</th><th align=left>% grasa</th><th align=left>Músculo</th><th align=left>Visc.</th><th></th></tr>${m.map((x,i)=>`<tr><td>${esc(fecha(x.f))}</td><td>${esc(x.kg)}</td><td>${esc(x.gr)}</td><td>${esc(x.mm)}</td><td>${esc(x.vis)}</td><td><button class="btn bad sm" data-a="delib" data-i="${i}" aria-label="Eliminar">✕</button></td></tr>`).join('')}</table></div>`:'')}
function sMedidas(c){const mc=c.medcorp||(c.medcorp=[]),a=mc[0],z=mc.at(-1),icc=z&&z.cintura&&z.cadera?z.cintura/z.cadera:null;

 (mc.length?`<div class="card" style="margin-top:12px"><h3>Evolución</h3><div style="overflow:auto"><table class="mct"><tr><th>Fecha</th>${CS.MC.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${mc.map((m,i)=>`<tr><td>${esc(fecha(m.f))}</td>${CS.MC.map(([k])=>`<td>${m[k]??'—'}</td>`).join('')}<td><button class="btn bad sm" data-a="delmc" data-i="${i}" aria-label="Eliminar">✕</button></td></tr>`).join('')}${mc.length>1?`<tr style="color:var(--neon);font-weight:700"><td>Cambio</td>${CS.MC.map(([k])=>{const d=a[k]!=null&&z[k]!=null?z[k]-a[k]:null;return `<td>${d==null?'—':(d>0?'▲ ':d<0?'▼ ':'')+Math.abs(d).toFixed(1)}</td>`}).join('')}<td></td></tr>`:''}</table></div>${icc?`<p style="margin-top:10px;color:var(--mut);font-size:13px">Índice cintura/cadera: <b style="color:var(--ink)">${icc.toFixed(2).replace('.',',')}</b> <span>(referencia OMS de riesgo aumentado: ≥ ${c.sx==='F'?'0,85':'0,90'})</span></p>`:''}</div>`:'')}
function grafico(m){if(m.length<2)return '<p style="color:var(--mut)">Con 2 chequeos se dibuja la evolución.</p>';const W=560,H=150,P=26,ser=[['kg','Peso kg','#19e3ee'],['mm','Músculo kg','#3ddc97'],['gr','% grasa','#ffc857']];
 const t=m.map(x=>+new Date(x.f)),t0=Math.min(...t),t1=Math.max(...t);

  return `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.join(' ')}"/>`+pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5" fill="${col}"/>`).join('')+`<text x="${P+si*150}" y="${H+22}" fill="${col}" font-size="13">● ${n}: ${v[0]} → ${v.at(-1)}</text>`}).join('')+`</svg>`}

async function cargarAct(c){const e=document.getElementById('act');if(!e)return;try{const {marcas,reportes}=await Store.actividad(c.id);
 const por={};marcas.forEach(x=>{(por[x.fecha]??={e:0,m:0})[x.clave[0]]++});
 const dias=[...Array(14)].map((_,n)=>{const d=new Date();d.setDate(d.getDate()-n);return CS.ymd(d)});
 const tot=f=>{const r=c.rutina;if(!r)return 0;const w=(new Date(f+'T12:00').getDay()+6)%7,i=r.dias.findIndex((_,k)=>CS.diaSem(r,k)===w);return i<0?0:r.dias[i].ej.length};
 const rows=dias.map(f=>{const t=tot(f),x=por[f]||{e:0,m:0};return t||x.e||x.m?`<tr><td>${esc(fecha(f))}</td><td>${x.e}/${t}</td><td>${x.m}</td></tr>`:''}).join('');
 e.innerHTML=`<h3>Avance del cliente</h3>${rows?`<table style="width:100%;font-size:14px;margin-top:8px"><tr><th align=left>Día</th><th align=left>Ejercicios</th><th align=left>Comidas</th></tr>${rows}</table>`:'<p style="color:var(--mut)">Sin registros en los últimos 14 días.</p>'}`+
 (reportes.length?`<h4 style="margin-top:12px;color:var(--neon);font-size:13px">REPORTES</h4>`+reportes.map(r=>`<p style="margin-top:6px"><small>${esc(fecha(r.fecha))}</small> ${r.peso?esc(r.peso)+' kg · ':''}${r.rpe?'esfuerzo '+esc(r.rpe)+'/10':''} ${r.nota?'· '+esc(r.nota):''}</p>`).join(''):'')}catch(x){e.innerHTML='<h3>Avance del cliente</h3><p class="bad">No se pudo cargar: '+esc(x.message)+'</p>'}}
