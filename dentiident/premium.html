<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Agenda tu cita — Dentiident (Premium)</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
body{background:var(--niebla)}
.lienzo{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));align-items:start;padding-block:40px 96px}
.caja{background:#fff;padding:clamp(22px,3.2vw,38px);box-shadow:0 20px 50px rgba(14,15,15,.08);display:flex;flex-direction:column;gap:24px}
.reco{background:var(--negro-logo);color:#fff;padding:20px 22px}
.reco small{color:#A5A6AB;font-size:13px}
.reco b{display:block;font-weight:700;font-size:26px;line-height:1.15;margin:4px 0}
.reco span{color:#C9C9CD;font-size:15px}
h2.paso{font-weight:600;font-size:20px}
.chips{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));margin-top:12px}
.chip{min-height:52px;border:1px solid #D9D9DC;background:#fff;color:var(--tinta);font:600 16px var(--f);cursor:pointer;padding:8px 6px;transition:background-color .2s,color .2s,border-color .2s}
.chip small{display:block;font-weight:400;font-size:13px}
.chip .n{display:block;font-weight:300;font-size:26px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip.dom:not([aria-pressed="true"]){border-color:#8E8F94;box-shadow:inset 0 -3px 0 #8E8F94}
.chip:disabled{background:#EDEDEF;color:#8A8B90;text-decoration:line-through;cursor:not-allowed}
.nota{margin-top:8px;font-size:14px;color:var(--suave)}
.datos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:12px}
.datos label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px;color:var(--texto)}
.campo{min-height:50px;border:1px solid #D0D0D4;padding:0 14px;font:400 16px var(--f);color:var(--tinta);background:#fff}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--texto);margin-top:14px}
.consent input{width:22px;height:22px;accent-color:var(--tinta);margin-top:1px;flex-shrink:0}
.lado{display:flex;flex-direction:column;gap:18px}
.agenda{background:#fff;padding:22px;box-shadow:0 20px 50px rgba(14,15,15,.08)}
.agenda-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--linea);padding-bottom:14px}
.agenda-cab b{font-size:20px;font-weight:600}
.agenda-cab span{font-size:13px;color:var(--suave)}
.fila{display:flex;gap:14px;padding-top:12px}
.fila .h{width:52px;flex-shrink:0;font-size:14px;font-weight:600;color:var(--suave);padding-top:10px}
.fila .c{flex:1;background:var(--niebla);padding:10px 14px;font-size:15px}
.fila .c small{display:block;opacity:.8;font-size:13px}
.fila .c.nueva{background:var(--tinta);color:#fff;box-shadow:inset 3px 0 0 #C9C9CD}
.aviso-wa{background:var(--negro-logo);color:#fff;padding:20px 22px}
.aviso-wa small{color:#A5A6AB;font-size:13px}
.check{width:64px;height:64px;border-radius:50%;background:var(--tinta);display:grid;place-items:center}
.volver{display:inline-flex;align-items:center;min-height:44px;color:#DADADD;text-decoration:none;font-size:15px}
</style>
</head>
<body data-pagina="premium" data-secciones='["Elegir día y hora","Datos","Confirmación","Agenda de Dentiident"]'>

<header class="cabecera"><div class="wrap">
  <a class="marca" href="index.html"><img src="assets/logo.webp" alt="" width="56" height="56"><span>DENTIIDENT<small>Agenda tu cita</small></span></a>
  <a class="volver" href="index.html">← Volver a la página</a>
</div></header>

<div class="wrap lienzo">
  <div class="caja" id="flujo" aria-live="polite"></div>
  <div class="lado">
    <h1 class="doble" style="font-size:clamp(30px,3.4vw,44px)"><span>Lo que ve</span>Dentiident</h1>
    <div class="agenda" id="agenda"></div>
    <div id="aviso"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
window.DEMO = window.DEMO || { cliente: 'Dentiident', waCliente: '593963911885' };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Viene del diagnóstico (index.html) o usa un ejemplo */
const q = new URLSearchParams(location.search);
const recos = { dolor: 'Valoración por dolor', estetica: 'Valoración estética', alinear: 'Valoración de ortodoncia', ninos: 'Consulta para niños', revision: 'Revisión y limpieza' };
const motivo = recos[q.get('m')] ? q.get('m') : 'dolor';
const diag = { reco: recos[motivo], detalle: q.get('d') || 'Empezó hoy', conoce: q.get('c') || 'Es mi primera vez', cuando: q.get('w') || 'Hoy o mañana' };
const menor = motivo === 'ninos';

/* Agenda de ejemplo (demo) */
const dias = [['Jue','1','oct'],['Vie','2','oct'],['Sáb','3','oct'],['Dom','4','oct'],['Lun','5','oct'],['Mar','6','oct']];
const slots = ['09:00','10:30','12:00','15:00','16:30','18:00'];
const citas = [
  [['10:30','Endodoncia · Mario P.','Segunda cita'],['16:30','Limpieza · Ana G.','']],
  [['09:00','Control · Luis T.','Convenio Policía'],['15:00','Cirugía · Andrea V.','Extracción']],
  [['12:00','Pacientito · Mateo, 7 años','Con su mamá'],['16:30','Valoración estética · Carla R.','Primera vez']],
  [['09:00','Control · Sofía M.',''],['12:00','Endodoncia · Jorge L.','Primera cita']],
  [['10:30','Limpieza · Diana C.',''],['18:00','Valoración · Pedro S.','Convenio Policía']],
  [['15:00','Control · Valeria N.','']]
];
const st = { dia: 3, hora: '', nombre: '', tel: '', consent: false, ok: false };
const fecha = () => { const d = dias[st.dia]; return `${d[0]} ${d[1]} ${d[2]}`; };
const listo = () => st.hora && st.nombre.trim().length >= 2 && st.tel.replace(/\D/g, '').length >= 9 && st.consent;

function agenda() {
  const filas = citas[st.dia].map(c => ({ h: c[0], t: esc(c[1]), d: esc(c[2]) }));
  if (st.ok) filas.push({ h: st.hora, t: esc(diag.reco) + ' · ' + esc(st.nombre.trim()), d: esc(diag.detalle) + ' · ' + esc(diag.conoce) + ' · desde la web', nueva: true });
  filas.sort((a, b) => a.h.localeCompare(b.h));
  document.getElementById('agenda').innerHTML =
    `<div class="agenda-cab"><b>Agenda · ${fecha()}</b><span>Google Calendar · ejemplo</span></div>` +
    filas.map(f => `<div class="fila"><div class="h">${f.h}</div><div class="c ${f.nueva ? 'nueva fx-nuevo' : ''}"><b style="font-weight:600">${f.t}</b>${f.d ? `<small>${f.d}</small>` : ''}</div></div>`).join('');
  document.getElementById('aviso').innerHTML = st.ok
    ? `<div class="aviso-wa fx-nuevo"><small>Aviso por WhatsApp a Dentiident</small><div style="margin-top:6px">Nueva cita: ${esc(st.nombre.trim())} · ${fecha()}, ${st.hora}. ${esc(diag.reco)}. ${esc(diag.detalle)}. ${esc(diag.conoce)}.</div></div>` : '';
}

function flujo() {
  const f = document.getElementById('flujo');
  if (st.ok) {
    f.innerHTML = `<div class="fx-paso" style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <div class="check" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline class="fx-trazo" points="20 6 9 17 4 12"/></svg></div>
      <h2 class="doble" style="font-size:clamp(30px,3.4vw,42px)"><span>Listo, ${esc(st.nombre.trim().split(' ')[0])}</span>Tu cita está agendada</h2>
      <div style="font-size:20px;font-weight:600">${fecha()}, ${st.hora}</div>
      <p style="color:var(--texto);max-width:46ch">Te enviamos la confirmación por WhatsApp y un recordatorio el día anterior. Si necesitas cambiar la hora, responde a ese mensaje.</p>
      <button type="button" class="btn btn-linea-osc" id="otra">Ver la demo otra vez</button></div>`;
    document.getElementById('otra').onclick = () => { Object.assign(st, { dia: 3, hora: '', nombre: '', tel: '', consent: false, ok: false }); flujo(); agenda(); };
    return;
  }
  const oc = citas[st.dia].map(c => c[0]);
  f.innerHTML = `
    <div class="reco"><small>Tu recomendación</small><b>${esc(diag.reco)}</b><span>${esc(diag.detalle)} · ${esc(diag.conoce)} · ${esc(diag.cuando)}</span></div>
    <div><h2 class="paso">1. Elige el día</h2><div class="chips">${dias.map((d, i) => `<button type="button" class="chip ${d[0] === 'Dom' ? 'dom' : ''}" data-dia="${i}" aria-pressed="${st.dia === i}"><small>${d[0]}</small><span class="n">${d[1]}</span><small>${d[2]}</small></button>`).join('')}</div>
      <p class="nota">También atendemos los domingos.</p></div>
    <div><h2 class="paso">2. Elige la hora</h2><div class="chips">${slots.map(h => `<button type="button" class="chip" data-hora="${h}" aria-pressed="${st.hora === h}" ${oc.includes(h) ? `disabled aria-label="${h} ocupada"` : ''}>${h}</button>`).join('')}</div>
      <p class="nota">Las horas tachadas ya están ocupadas. [CONFIRMAR HORARIO REAL DE CADA DÍA]</p></div>
    <div><h2 class="paso">3. ${menor ? 'Datos del representante' : 'Tus datos'}</h2>
      <div class="datos"><label>${menor ? 'Nombre del representante' : 'Nombre'}<input class="campo" id="nom" autocomplete="name" value="${esc(st.nombre)}"></label><label>WhatsApp<input class="campo" id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="099 000 0000" value="${esc(st.tel)}"></label></div>
      <label class="consent"><input type="checkbox" id="con" ${st.consent ? 'checked' : ''}><span>${menor ? 'Soy el representante del menor y acepto' : 'Acepto'} que ${esc(DEMO.cliente)} use estas respuestas solo para preparar la cita y contactarme. [ENLACE AVISO DE PRIVACIDAD]</span></label></div>
    <button type="button" class="btn btn-tinta" id="conf" ${listo() ? '' : 'disabled'}>Confirmar cita${st.hora ? ' · ' + fecha() + ', ' + st.hora : ''}</button>`;
  f.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => { st.dia = +b.dataset.dia; st.hora = ''; flujo(); agenda(); });
  f.querySelectorAll('[data-hora]').forEach(b => b.onclick = () => { st.hora = b.dataset.hora; flujo(); });
  const upd = () => { document.getElementById('conf').disabled = !listo(); };
  document.getElementById('nom').oninput = e => { st.nombre = e.target.value; upd(); };
  document.getElementById('tel').oninput = e => { st.tel = e.target.value; upd(); };
  document.getElementById('con').onchange = e => { st.consent = e.target.checked; upd(); };
  document.getElementById('conf').onclick = () => { if (listo()) { st.ok = true; flujo(); agenda(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
}
flujo(); agenda();
</script>
<script src="demo.js"></script>
</body>
</html>
