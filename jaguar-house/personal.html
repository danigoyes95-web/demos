<title>Pantalla de ventas · Jaguar House (Premium)</title>
<meta name="description" content="Pantalla del personal de Jaguar House: registrar ventas del local, confirmar pedidos de la web y anular errores.">
<link rel="stylesheet" href="modulos/restaurante/rest.css">
<link rel="stylesheet" href="modulos/restaurante/rest-panel.css">
</head>
<body class="rest-oscuro" data-pagina="Pantalla de ventas (personal)" data-secciones='["Vender", "Pedidos web", "Mis ventas"]'>
<header class="cabecera"><div class="wrap">
  <a class="marca" href="inicio.html"><img src="assets/logo.webp" alt="" width="52" height="52"><span><b>Jaguar House</b><small>Pantalla de ventas</small></span></a>
  <nav aria-label="Pantallas del local"><a href="dashboard.html">Dashboard del dueño</a><a href="inicio.html">La página</a><a href="index.html">Demo</a></nav>
</div></header>
<main class="rest-panel">
  <div class="wrap">
    <div id="rp-entrada" hidden></div>
    <div id="rp-app" hidden>
      <div class="rp-barra">
        <h1 id="rp-quien">Ventas del local</h1>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div class="rp-tabs" role="tablist" aria-label="Qué quieres hacer">
            <button type="button" role="tab" id="t-vender" aria-selected="true" aria-controls="p-vender">Vender</button>
            <button type="button" role="tab" id="t-pedidos" aria-selected="false" aria-controls="p-pedidos">Pedidos web <span class="n" id="rp-n" hidden>0</span></button>
            <button type="button" role="tab" id="t-ventas" aria-selected="false" aria-controls="p-ventas">Mis ventas</button>
            
          </div>
          <button type="button" class="rest-btn sec chico" id="rp-salir">Salir</button>
        </div>
      </div>

      <section id="p-vender" role="tabpanel" aria-labelledby="t-vender" class="rp-vender">
        <div id="rp-botones"></div>
        <aside class="rest-tarjeta rp-ticket" aria-label="Venta en curso">
          <ul id="rp-lineas"></ul><p class="rp-vacio" id="rp-vacio">Toca una burger para empezar la venta.</p>
          <div class="rp-total"><span>Total</span><b id="rp-total">$0.00</b></div>
          <div style="display:flex;gap:10px"><button type="button" class="rest-btn" id="rp-registrar" style="flex:1" disabled>Registrar venta</button><button type="button" class="rest-btn sec" id="rp-limpiar" aria-label="Vaciar la venta">Vaciar</button></div>
        </aside>
      </section>

      <section id="p-pedidos" role="tabpanel" aria-labelledby="t-pedidos" hidden><div class="rp-lista" id="rp-pedidos"></div></section>
      <section id="p-ventas" role="tabpanel" aria-labelledby="t-ventas" hidden><div class="rp-lista" id="rp-ventas"></div></section>
      
    </div>
  </div>
</main>
<dialog class="rest-dialogo" id="rp-dialogo"><form method="dialog"><h2>Anular venta</h2><label class="rest-campo">Motivo<input id="rp-motivo" maxlength="200" placeholder="Ej.: me equivoqué de burger" required></label>
  <div class="acc"><button value="no" class="rest-btn sec" formnovalidate>Volver</button><button value="si" class="rest-btn peligro" id="rp-anular-ok">Anular</button></div></form></dialog>
<script src="config.js"></script>
<script src="menu.js"></script>
<script src="modulos/restaurante/restaurante-datos.js"></script>
<script src="modulos/restaurante/rest-ui.js"></script>
<script src="modulos/restaurante/rest-mock.js"></script>
<script src="modulos/restaurante/rest-api.js"></script>
<script src="modulos/restaurante/rest-personal.js"></script>
<script src="demo.js"></script>
</body>
</html>
