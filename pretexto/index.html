<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Pretexto · Pide en 3 toques</title>
<meta name="description" content="El Pretexto Liquor Store, Ambato. Pide licor y extras desde el celular con entrega o retiro. Cualquiera es bueno…">
<meta name="theme-color" content="#0A0A0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <section id="display" class="display" aria-live="polite">
    <div class="d-top">
      <span class="brand"><img src="icons/logo-160.png" alt="" width="18" height="18"><b>El Pretexto</b><i>· Ambato</i></span>
      <span id="hours" class="pill"></span>
      <button id="snd" class="mini" type="button" aria-label="Sonido de teclas"></button>
    </div>
    <div class="d-main">
      <div id="dialed" class="dialed"></div>
      <button id="back" class="back" type="button" aria-label="Borrar el último producto"></button>
    </div>
  </section>
  <div id="quick" class="quick" aria-label="Pedidos rápidos"></div>
  <main id="grid" class="grid" aria-label="Categorías"></main>
  <div class="cta-row"><button id="cta" class="cta" type="button"></button></div>
  <footer class="foot">
    <span>Beber con moderación · Solo mayores de 18 años</span>
    <a href="admin/">Panel</a>
  </footer>
</div>
<div id="sheet-root"></div>
<div id="checkout-root"></div>
<div id="age-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
